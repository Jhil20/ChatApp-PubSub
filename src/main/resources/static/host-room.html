<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host Room</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <h1>Host a Room</h1>
